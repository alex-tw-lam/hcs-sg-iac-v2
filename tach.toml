# tach.toml — the ring-direction contract (docs/architecture.md).
# Four RING-LEVEL modules keep this tiny: sibling imports inside a ring
# (usecases/pipeline -> usecases/plan, adapters/huawei_gateway ->
# adapters/ratelimit) are internal by construction and need no lines
# here. Per-FILE third-party designation is NOT tach's job — that stays
# in tests/test_architecture.py (the registry that fails on
# unregistered adapter files).
exclude = ["**/__pycache__", ".venv", "tests", "docs", "schemas"]
source_roots = ["."]

[[modules]]
path = "hcs_sg_iac.model"
depends_on = []

[[modules]]
path = "hcs_sg_iac.usecases"
depends_on = ["hcs_sg_iac.model"]

[[modules]]
path = "hcs_sg_iac.adapters"
depends_on = ["hcs_sg_iac.model"]

[[modules]]
path = "hcs_sg_iac.cli"
depends_on = [
    "hcs_sg_iac.model",
    "hcs_sg_iac.usecases",
    "hcs_sg_iac.adapters",
]
