# tach.toml — the dependency-direction contract (README §Architecture).
# Three vocabulary leaves + three rings; sibling imports inside a ring
# (usecases/pipeline -> usecases/plan) are internal by construction and
# need no lines here. Per-FILE third-party designation is NOT tach's
# job — that stays in tests/test_architecture.py (the registry that
# fails on unregistered adapter files).
exclude = ["**/__pycache__", ".venv", "tests"]
source_roots = ["."]

# ---- vocabulary + brain leaves ----
[[modules]]
path = "hcs_sg_iac.entities"
depends_on = []

[[modules]]
path = "hcs_sg_iac.snapshot"
depends_on = ["hcs_sg_iac.entities"]

[[modules]]
path = "hcs_sg_iac.contracts"
depends_on = ["hcs_sg_iac.entities", "hcs_sg_iac.snapshot"]

[[modules]]
path = "hcs_sg_iac.engine"
depends_on = ["hcs_sg_iac.entities", "hcs_sg_iac.snapshot", "hcs_sg_iac.contracts"]

# ---- rings ----
[[modules]]
path = "hcs_sg_iac.adapters"
depends_on = [
    "hcs_sg_iac.entities",
    "hcs_sg_iac.snapshot",
    "hcs_sg_iac.contracts",
]

[[modules]]
path = "hcs_sg_iac.cli"
depends_on = [
    "hcs_sg_iac.entities",
    "hcs_sg_iac.contracts",
    "hcs_sg_iac.snapshot",
    "hcs_sg_iac.engine",
    "hcs_sg_iac.adapters",
]
